<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f6f3">
<title>투자 노트</title>
<style>
:root{
  --bg:#f7f6f3; --card:#fff; --line:#e7e4de; --ink:#22211f; --sub:#77736b; --accent:#2f5bd3;
  --chip:#efece6; --up:#d23c3c; --down:#2f5bd3; --ok:#1f8a4c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161615; --card:#201f1d; --line:#34322e; --ink:#ecebe7; --sub:#a29e95; --accent:#7d9cf0; --chip:#2b2a27;
  }
}
:root[data-theme="dark"]{--bg:#161615; --card:#201f1d; --line:#34322e; --ink:#ecebe7; --sub:#a29e95; --accent:#7d9cf0; --chip:#2b2a27;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
h1{font-size:19px;margin:0 0 8px}
nav{display:flex;gap:4px}
nav button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-weight:600;padding:9px 0;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:12px 16px 80px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:110px;resize:vertical}
.day{font-size:13px;font-weight:700;color:var(--sub);margin:16px 2px 6px}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px;color:inherit;font:inherit}
.meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
.kind{background:var(--chip);border-radius:6px;padding:1px 6px;color:var(--ink)}
.dot{color:var(--ok);font-weight:700}
.title{margin-top:3px;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.back{border:0;background:none;color:var(--accent);font:inherit;padding:4px 0;margin-bottom:6px}
.frame{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:300px;display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.hint{font-size:13px;color:var(--sub)}
.msg{font-size:13px;margin-left:8px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
.q{display:flex;align-items:center;gap:10px}
.q .nm{flex:1;min-width:0}.q .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .px{text-align:right;font-variant-numeric:tabular-nums}.q .px b{display:block}
.up{color:var(--up)}.dn{color:var(--down)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 0;font:inherit;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.chart{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px 4px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:6px;left:10px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;margin-top:10px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.stats span{color:var(--sub)}
ol{padding-left:20px} li{margin-bottom:4px}
code{background:var(--chip);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<header>
  <h1>투자 노트</h1>
  <nav>
    <button data-tab="posts" class="on">받은 글</button>
    <button data-tab="quotes">시세</button>
    <button data-tab="notes">내 노트</button>
    <button data-tab="set">설정</button>
  </nav>
</header>
<main id="app"></main>

<script>
const OWNER = "zionfaith-k", REPO = "invest-note-data", API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const $app = document.getElementById("app");
const S = { tab: "posts", month: null, months: [], posts: [], kind: "전체", memos: new Set() };

function token(){ try{ return localStorage.getItem("invest_note_token") || ""; }catch(e){ return ""; } }
function setToken(v){ try{ v ? localStorage.setItem("invest_note_token", v) : localStorage.removeItem("invest_note_token"); }catch(e){} }
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function gh(path, opt = {}){
  const r = await fetch(API + enc(path) + (opt.method ? "" : `?t=${Date.now()}` + (opt.ref ? `&ref=${opt.ref}` : "")), {
    method: opt.method || "GET", cache: "no-store",
    headers: { Authorization: `Bearer ${token()}`, Accept: opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
               ...(opt.body ? {"Content-Type": "application/json"} : {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`${r.status} ${r.status === 401 ? "접근 키가 맞지 않아요" : r.statusText}`);
  return opt.raw ? r.text() : r.json();
}
const getJSON = async p => { const t = await gh(p, {raw: true}); return t ? JSON.parse(t) : null; };
const b64 = s => { const b = new TextEncoder().encode(s); let x = ""; b.forEach(c => x += String.fromCharCode(c)); return btoa(x); };
async function putText(path, text, msg){
  const cur = await gh(path);
  return gh(path, { method: "PUT", body: { message: msg, content: b64(text), ...(cur ? {sha: cur.sha} : {}) } });
}
async function delFile(path, msg){
  const cur = await gh(path); if (cur) await gh(path, { method: "DELETE", body: { message: msg, sha: cur.sha } });
}

function needToken(){
  if (token()) return false;
  $app.innerHTML = `<div class="empty">처음 한 번 접근 키를 넣어야 글이 보여요.<br><br><button class="btn" onclick="go('set')">설정으로</button></div>`;
  return true;
}
function fail(e){ $app.innerHTML = `<div class="empty">불러오지 못했어요: ${esc(e.message)}<br><br><button class="btn ghost" onclick="go(S.tab)">다시 시도</button></div>`; }
const WD = "일월화수목금토";
function dayLabel(t){ const d = new Date(t.slice(0,10) + "T00:00"); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; }

/* ── 받은 글 ── */
async function loadPosts(){
  if (needToken()) return;
  $app.innerHTML = `<div class="empty">불러오는 중…</div>`;
  try{
    S.months = (await getJSON("index/months.json")) || [];
    if (!S.month || !S.months.includes(S.month)) S.month = S.months[0];
    const [posts, memos] = await Promise.all([ S.month ? getJSON(`index/${S.month}.json`) : [], gh("memos") ]);
    S.posts = posts || [];
    S.memos = new Set((memos || []).map(f => f.name.replace(/\.md$/, "")));
    drawPosts();
  }catch(e){ fail(e); }
}
function drawPosts(){
  const kinds = ["전체", ...new Set(S.posts.map(p => p.kind))];
  if (!kinds.includes(S.kind)) S.kind = "전체";
  const list = S.posts.filter(p => S.kind === "전체" || p.kind === S.kind);
  let html = `<div class="row"><select onchange="S.month=this.value;loadPosts()">${S.months.map(m => `<option ${m===S.month?"selected":""}>${m}</option>`).join("")}</select>
    <span class="hint">${list.length}개</span><span style="flex:1"></span><button class="btn ghost" onclick="loadPosts()">새로고침</button></div>
    <div class="chips">${kinds.map(k => `<button class="chip ${k===S.kind?"on":""}" onclick="S.kind='${esc(k)}';drawPosts()">${esc(k)}</button>`).join("")}</div>`;
  if (!list.length) html += `<div class="empty">아직 글이 없어요.</div>`;
  let day = "";
  for (const p of list){
    const d = p.t.slice(0,10);
    if (d !== day){ day = d; html += `<div class="day">${dayLabel(p.t)}</div>`; }
    html += `<button class="item" onclick="openPost('${p.id}')"><div class="meta"><span>${p.t.slice(11)}</span><span class="kind">${esc(p.kind)}</span>${S.memos.has(p.id) ? '<span class="dot">✎ 메모</span>' : ""}</div>
      <div class="title">${esc(p.title.replace(/^\s*\[[^\]]+\]\s*/, ""))}</div></button>`;
  }
  $app.innerHTML = html;
}
async function openPost(id){
  const p = S.posts.find(x => x.id === id); if (!p) return;
  location.hash = "p=" + id;
  $app.innerHTML = `<button class="back" onclick="history.back()">‹ 목록</button>
    <div class="meta"><span>${dayLabel(p.t)} ${p.t.slice(11)}</span><span class="kind">${esc(p.kind)}</span></div>
    <div class="title" style="font-size:17px;margin:4px 0 10px">${esc(p.title)}</div>
    <iframe class="frame" id="fr" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
    <div class="box"><b>내 메모</b> <span class="hint">예상 vs 실제, 오늘 한 행동 등</span>
      <textarea id="memo" placeholder="불러오는 중…" disabled></textarea>
      <div class="row" style="margin:8px 0 0"><button class="btn" id="sv" onclick="saveMemo('${id}')">메모 저장</button><span class="msg" id="mm"></span></div></div>`;
  try{
    const [page, memo] = await Promise.all([ gh(p.path, {raw: true}), gh(`memos/${id}.md`, {raw: true}) ]);
    const fr = document.getElementById("fr");
    fr.onload = () => { try{
      const d = fr.contentDocument, w = d.documentElement.clientWidth, sw = d.documentElement.scrollWidth;
      if (sw > w + 4 && !d.querySelector("[data-keep]")) d.body.style.zoom = (w / sw).toFixed(3);   // 옛 580px 고정 메일은 폭에 맞게 줄임
      fr.style.height = (d.documentElement.scrollHeight + 8) + "px"; }catch(e){} };
    fr.srcdoc = `<base target="_blank"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:8px;overflow-wrap:anywhere}img,table{max-width:100%!important}</style>` + (page || "본문을 찾지 못했어요.");
    const ta = document.getElementById("memo"); ta.disabled = false; ta.placeholder = "여기에 적고 저장"; ta.value = memo || "";
  }catch(e){ document.getElementById("mm").textContent = "불러오기 실패: " + e.message; }
}
async function saveMemo(id){
  const v = document.getElementById("memo").value, mm = document.getElementById("mm"), sv = document.getElementById("sv");
  sv.disabled = true; mm.textContent = "저장 중…";
  try{
    if (v.trim()){ await putText(`memos/${id}.md`, v, `메모: ${id}`); S.memos.add(id); }
    else { await delFile(`memos/${id}.md`, `메모 삭제: ${id}`); S.memos.delete(id); }
    mm.textContent = "저장했어요 ✓";
  }catch(e){ mm.textContent = "실패: " + e.message; }
  sv.disabled = false;
}

/* ── 시세 ── */
const CAT = { hold: "보유", "kr-stock": "국내 주식", "kr-etf": "국내 ETF", "us-stock": "미국 주식", "us-etf": "미국 ETF" };
S.qcat = "전체"; S.range = "오늘";
const fmt = (v, cur) => v == null ? "-" : cur === "KRW" ? Math.round(v).toLocaleString("ko-KR") : (+v).toLocaleString("en-US", {maximumFractionDigits: 2});
const pct = v => v == null ? "-" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "dn" : "";
async function loadQuotes(){
  if (needToken()) return;
  $app.innerHTML = `<div class="empty">불러오는 중…</div>`;
  try{ S.prices = await getJSONref("prices.json", "live"); drawQuotes(); }catch(e){ fail(e); }
}
async function getJSONref(p, ref){ const t = await gh(p, {raw: true, ref}); return t ? JSON.parse(t) : null; }
function catOf(it){ return it.type === "hold" ? "보유" : (CAT[it.cat] || "기타"); }
function spark(it){
  const today = it.intra && it.intra.c.length > 1 && it.intraDate;
  const ys = today ? it.intra.c : it.daily.c.slice(-22);
  const base = today ? it.prev : ys[0];
  return line(ys, {w: 90, h: 34, base, color: ys[ys.length-1] >= base ? "var(--up)" : "var(--down)", pad: 2});
}
function line(ys, o){
  const w = o.w, h = o.h, p = o.pad ?? 6, v = ys.filter(x => x != null);
  let lo = Math.min(...v, o.base ?? Infinity), hi = Math.max(...v, o.base ?? -Infinity); if (hi === lo){ hi += 1; lo -= 1; }
  const n = o.slots || ys.length, X = i => p + (w - 2*p) * (n > 1 ? i/(n-1) : .5), Y = y => p + (h - 2*p) * (1 - (y - lo)/(hi - lo));
  const d = ys.map((y, i) => y == null ? "" : `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join("");
  const b = o.base != null ? `<line x1="${p}" x2="${w-p}" y1="${Y(o.base)}" y2="${Y(o.base)}" stroke="var(--sub)" stroke-dasharray="3 3" stroke-width="1" opacity=".6"/>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" ${o.big ? "" : `width="${w}" height="${h}"`}>${b}<path d="${d}" fill="none" stroke="${o.color}" stroke-width="${o.big ? 2 : 1.5}" stroke-linejoin="round"/>${o.extra || ""}</svg>`;
}
function drawQuotes(){
  const P = S.prices; if (!P){ $app.innerHTML = `<div class="empty">시세 파일이 아직 없어요.</div>`; return; }
  const cats = ["전체", ...["보유","국내 주식","국내 ETF","미국 주식","미국 ETF","기타"].filter(c => P.items.some(i => catOf(i) === c))];
  const list = P.items.filter(i => S.qcat === "전체" || catOf(i) === S.qcat);
  let html = `<div class="row"><span class="hint">기준 ${esc(P.generatedAt)}${P.fx ? ` · 환율 ${P.fx.price.toLocaleString()}원` : ""}</span><span style="flex:1"></span><button class="btn ghost" onclick="loadQuotes()">새로고침</button></div>
    <div class="chips">${cats.map(c => `<button class="chip ${c===S.qcat?"on":""}" onclick="S.qcat='${c}';drawQuotes()">${c}</button>`).join("")}</div>`;
  for (const it of list){
    html += `<button class="item q" onclick="openQuote('${esc(it.ticker)}')"><div class="nm"><b>${esc(it.name)}</b><span class="hint">${esc(it.ticker)} · ${esc(catOf(it))}</span></div>
      ${spark(it)}<div class="px"><b>${fmt(it.price, it.currency)}</b><span class="${cls(it.chg)}">${pct(it.chg)}</span></div></button>`;
  }
  if (P.errors && P.errors.length) html += `<p class="hint">못 받은 것: ${P.errors.map(esc).join(" · ")}</p>`;
  html += `<p class="hint">실시간이 아니에요. 장중 20분마다 새로 받아요(국내 약 1분 지연 자료). 미국은 장중 1~2번.</p>`;
  $app.innerHTML = html;
}
function openQuote(tk){
  const it = S.prices.items.find(x => x.ticker === tk); if (!it) return;
  location.hash = "q=" + tk; S.cur = it;
  const hasToday = it.intra && it.intra.c.length > 1;
  if (!hasToday && S.range === "오늘") S.range = "1개월";
  $app.innerHTML = `<button class="back" onclick="history.back()">‹ 시세</button>
    <div class="q"><div class="nm"><b style="font-size:18px">${esc(it.name)}</b><span class="hint">${esc(it.ticker)} · ${esc(it.asOf)}</span></div>
    <div class="px"><b style="font-size:18px">${fmt(it.price, it.currency)}</b><span class="${cls(it.chg)}">${pct(it.chg)}</span></div></div>
    <div class="seg">${["오늘","1개월","3개월","6개월"].map(r => `<button class="${r===S.range?"on":""}" ${r==="오늘"&&!hasToday?"disabled":""} onclick="S.range='${r}';openQuote('${esc(tk)}')">${r==="오늘"?(it.market==="US"?"최근 장(5분)":"오늘(5분)"):r}</button>`).join("")}</div>
    <div class="chart" id="ch"></div><div class="stats" id="st"></div>
    <p class="hint">${S.range==="오늘" ? "5분마다 마지막 체결가를 이은 선 · 점선 = 전날 종가" : "일봉 종가를 이은 선 · 점선 = 기간 첫날 종가"} · 차트를 누르거나 밀면 그 시점 값이 보여요.</p>`;
  drawChart(it);
}
function drawChart(it){
  const W = 360, H = 220, today = S.range === "오늘";
  let xs, ys, base;
  if (today){
    xs = it.intra.t; ys = it.intra.c; base = it.prev;
  } else {
    const n = {"1개월": 22, "3개월": 66, "6개월": 130}[S.range];
    xs = it.daily.d.slice(-n); ys = it.daily.c.slice(-n); base = ys[0];
  }
  let slots = ys.length;
  if (today && it.market === "KR") slots = 78;        // 09:00~15:25 → 장 전체 폭에 맞춰 진행 정도가 보이게
  const lo = Math.min(...ys, base), hi = Math.max(...ys, base);
  const last = ys[ys.length-1], color = last >= base ? "var(--up)" : "var(--down)";
  const ch = document.getElementById("ch");
  const lab = `<text x="${W-4}" y="14" text-anchor="end" font-size="11" fill="var(--sub)">${fmt(hi, it.currency)}</text><text x="${W-4}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--sub)">${fmt(lo, it.currency)}</text>
    <text x="6" y="${H-6}" font-size="11" fill="var(--sub)">${esc(xs[0] || "")}</text>`;
  ch.innerHTML = `<div class="tip" id="tp"></div>` + line(ys, {w: W, h: H, base, color, pad: 18, slots, big: true, extra: lab + `<circle id="cur" r="4" fill="${color}" cx="-10" cy="-10"/>`});
  const p = 18, X = i => p + (W - 2*p) * (slots > 1 ? i/(slots-1) : .5), Y = y => p + (H - 2*p) * (1 - (y - lo)/((hi - lo) || 1));
  const tp = document.getElementById("tp"), cur = document.getElementById("cur");
  const show = i => { i = Math.max(0, Math.min(ys.length-1, i)); cur.setAttribute("cx", X(i)); cur.setAttribute("cy", Y(ys[i]));
    const r = (ys[i]/base - 1) * 100; tp.innerHTML = `${esc(xs[i])} · <b style="color:var(--ink)">${fmt(ys[i], it.currency)}</b> <span class="${cls(r)}">${pct(r)}</span>`; };
  const svg = ch.querySelector("svg");
  const mv = e => { const b = svg.getBoundingClientRect(), x = (e.clientX - b.left) / b.width * W; show(Math.round((x - p) / (W - 2*p) * (slots - 1))); };
  svg.addEventListener("pointerdown", mv); svg.addEventListener("pointermove", e => (e.buttons || e.pointerType === "touch") && mv(e));
  show(ys.length - 1);
  const D = it.daily, n = D.c.length, hi6 = Math.max(...D.h.filter(x => x != null)), lo6 = Math.min(...D.l.filter(x => x != null));
  const todayBar = D.d[n-1].replace(/-/g, "") === (it.intraDate || "");
  const st = [["전날 종가", fmt(it.prev, it.currency)], [todayBar ? "오늘 시가" : "마지막 날 시가", fmt(D.o[n-1], it.currency)],
    [todayBar ? "오늘 고가" : "마지막 날 고가", fmt(D.h[n-1], it.currency)], [todayBar ? "오늘 저가" : "마지막 날 저가", fmt(D.l[n-1], it.currency)],
    ["6개월 고점", fmt(hi6, it.currency)], ["고점 대비", `<b class="${cls(it.price/hi6-1)}">${pct((it.price/hi6-1)*100)}</b>`],
    ["6개월 저점", fmt(lo6, it.currency)], ["저점 대비", `<b class="${cls(it.price/lo6-1)}">${pct((it.price/lo6-1)*100)}</b>`]];
  document.getElementById("st").innerHTML = st.map(([a, b]) => `<div><span>${a}</span>${b}</div>`).join("");
}

/* ── 내 노트 ── */
async function loadNotes(){
  if (needToken()) return;
  $app.innerHTML = `<div class="empty">불러오는 중…</div>`;
  try{
    const files = ((await gh("notes")) || []).filter(f => f.name.endsWith(".md")).sort((a,b) => b.name.localeCompare(a.name)).slice(0, 60);
    const texts = await Promise.all(files.map(f => gh(f.path, {raw: true})));
    S.notes = files.map((f, i) => ({ name: f.name, text: texts[i] || "" }));
    let html = `<div class="row"><button class="btn" onclick="editNote()">＋ 새 노트</button><span style="flex:1"></span><button class="btn ghost" onclick="loadNotes()">새로고침</button></div>`;
    if (!S.notes.length) html += `<div class="empty">아직 노트가 없어요. 복기·계획·궁금한 점을 적어 두세요.</div>`;
    for (const n of S.notes){
      const m = n.name.match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/);
      const lines = n.text.trim().split("\n");
      html += `<button class="item" onclick="editNote('${n.name}')"><div class="meta"><span>${m ? `${+m[2]}/${+m[3]} ${m[4]}:${m[5]}` : esc(n.name)}</span></div>
        <div class="title">${esc(lines[0] || "(빈 노트)")}</div>${lines.length > 1 ? `<div class="hint">${esc(lines.slice(1).join(" ").slice(0, 90))}</div>` : ""}</button>`;
    }
    $app.innerHTML = html;
  }catch(e){ fail(e); }
}
function editNote(name){
  const n = name ? S.notes.find(x => x.name === name) : null;
  if (!name){ const d = new Date(), z = x => String(x).padStart(2, "0");
    name = `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.md`; }
  location.hash = "n=" + name;
  $app.innerHTML = `<button class="back" onclick="history.back()">‹ 노트 목록</button>
    <div class="hint">첫 줄이 제목이 돼요.</div>
    <textarea id="nt" style="min-height:55vh">${esc(n ? n.text : "")}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="sv" onclick="saveNote('${name}')">저장</button>
    ${n ? `<button class="btn ghost" onclick="removeNote('${name}')">삭제</button>` : ""}<span class="msg" id="mm"></span></div>`;
}
async function saveNote(name){
  const mm = document.getElementById("mm"), sv = document.getElementById("sv"); sv.disabled = true; mm.textContent = "저장 중…";
  try{ await putText(`notes/${name}`, document.getElementById("nt").value, `노트: ${name}`); mm.textContent = "저장했어요 ✓"; }
  catch(e){ mm.textContent = "실패: " + e.message; }
  sv.disabled = false;
}
async function removeNote(name){
  if (!confirm("이 노트를 지울까요?")) return;
  try{ await delFile(`notes/${name}`, `노트 삭제: ${name}`); history.back(); }catch(e){ alert("실패: " + e.message); }
}

/* ── 설정 ── */
function drawSet(){
  $app.innerHTML = `<div class="box"><b>접근 키</b>
    <p class="hint">글은 비공개 저장소 <code>${REPO}</code>에 있어요. 이 화면은 코드만 있어서, 키가 없으면 아무것도 안 보여요. 키는 이 기기 브라우저에만 저장돼요.</p>
    <input id="tk" type="password" style="width:100%" placeholder="github_pat_…" value="${esc(token())}">
    <div class="row" style="margin-top:8px"><button class="btn" onclick="saveToken()">저장하고 확인</button><button class="btn ghost" onclick="setToken('');drawSet()">이 기기에서 지우기</button></div>
    <div class="msg" id="mm" style="margin:4px 0 0"></div></div>
    <div class="box"><b>키 만드는 법 (한 번만)</b><ol class="hint">
      <li>GitHub → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>
      <li>Repository access: <b>Only select repositories</b> → <code>${REPO}</code> 하나만</li>
      <li>Permissions → Repository → <b>Contents: Read and write</b></li>
      <li>만들어진 <code>github_pat_…</code> 를 위 칸에 붙여 넣기</li></ol></div>`;
}
async function saveToken(){
  setToken(document.getElementById("tk").value.trim());
  const mm = document.getElementById("mm"); mm.textContent = "확인 중…";
  try{ const m = await getJSON("index/months.json"); mm.textContent = m ? `연결됐어요 ✓ (글 있는 달 ${m.length}개)` : "연결은 됐는데 글 목록이 없어요"; }
  catch(e){ mm.textContent = "실패: " + e.message; }
}

/* ── 이동 ── */
function go(tab){
  S.tab = tab; history.replaceState(null, "", location.pathname);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ({ posts: loadPosts, quotes: loadQuotes, notes: loadNotes, set: drawSet })[tab]();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.tab));
window.addEventListener("popstate", () => { if (location.hash) return;
  if (S.tab === "posts" && S.posts.length) drawPosts(); else if (S.tab === "quotes" && S.prices) drawQuotes(); else go(S.tab); });
go("posts");
</script>
</body>
